spring.application.name=cafe-management

# ---------------------------------------------------------------------------
# MySQL datasource.
# Credentials are read from environment variables so that no secret is ever
# stored in a tracked source file.  See .env.example for the expected names.
# ---------------------------------------------------------------------------

# Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
# Comma-separated list of origins allowed to call this API. Wildcards such as
# http://localhost:* are supported. A deployed frontend must be listed here or
# the browser blocks every request with a CORS preflight failure.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Application specific settings
# ---------------------------------------------------------------------------
# JWT signing secret (Base64 or plain text, at least 32 characters for HS256).
app.jwt.secret=${JWT_SECRET:cafe-management-system-development-secret-key-change-me}
# Token validity in milliseconds (default 24 hours).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cafe details used on the printed / PDF invoice.
app.cafe.name=${CAFE_NAME:Kettle & Kitchen}
app.cafe.address=${CAFE_ADDRESS:123 Coffee Street, Bengaluru, India}
app.cafe.phone=${CAFE_PHONE:+91 98765 43210}
app.cafe.currency=${CAFE_CURRENCY:INR}

# First-admin bootstrap. An ADMIN account is created at startup ONLY when no user
# with this email exists. Change these (or the account password) after first login.
app.admin.email=${ADMIN_EMAIL:admin@cafe.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Demo STAFF account. Created at startup ONLY when the users table has no STAFF
# user yet, so the role-based authorisation can be tested immediately.
app.staff.email=${STAFF_EMAIL:ravi@cafe.com}
app.staff.password=${STAFF_PASSWORD:Staff@123}

# ---------------------------------------------------------------------------
# Alternative sign-in methods.
# ---------------------------------------------------------------------------
# Brute-force protection shared by the staff-PIN and phone-code sign-in routes:
# after this many failures the staff code / phone number is locked out.
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
app.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# --- Phone + one-time code --------------------------------------------------
app.otp.enabled=${OTP_ENABLED:true}
app.otp.length=${OTP_LENGTH:6}
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# 'log' writes the code to the application log (development only).
# 'http' POSTs {"to","message"} as JSON to a gateway webhook - see HttpSmsSender.
# Set to 'disabled' to switch phone sign-in off entirely.
app.otp.sms.provider=${OTP_SMS_PROVIDER:log}
app.otp.sms.http.url=${OTP_SMS_URL:}
app.otp.sms.http.token=${OTP_SMS_TOKEN:}
app.otp.sms.http.sender-id=${OTP_SMS_SENDER_ID:}

# --- Google Sign-In ---------------------------------------------------------
# Paste the OAuth 2.0 Web Client ID from Google Cloud Console. While it is empty
# the Google button is reported as unavailable by GET /api/auth/providers.
app.social.google.client-id=${GOOGLE_CLIENT_ID:}

# --- Sign in with Apple -----------------------------------------------------
# Paste the Apple Service ID (e.g. com.yourcafe.web). While it is empty the Apple
# button is reported as unavailable by GET /api/auth/providers.
app.social.apple.client-id=${APPLE_CLIENT_ID:}

# ---------------------------------------------------------------------------
# Performance Tuning: HikariCP Connection Pool
# ---------------------------------------------------------------------------
# These settings maintain warm connections to avoid the expensive SSL/TLS
# handshake overhead (approx. 4-6 round trips) on the Render-to-Aiven path.
# ---------------------------------------------------------------------------
# Keep a small set of connections always open.
spring.datasource.hikari.minimum-idle=5
# Maximum number of connections in the pool.
spring.datasource.hikari.maximum-pool-size=10
# How long a connection can sit idle before being closed (5 minutes).
spring.datasource.hikari.idle-timeout=300000
# Maximum age of a connection before it is retired (30 minutes).
spring.datasource.hikari.max-lifetime=1800000
# How long to wait for a connection from the pool before throwing an error.
spring.datasource.hikari.connection-timeout=30000
# Send a "ping" every minute to keep the connection alive.
spring.datasource.hikari.keepalive-time=60000
